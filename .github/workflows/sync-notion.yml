name: Sync Notion to Blog

on:
  # Schedule removed 2026-11-06: GitHub's */15 cron only actually fired
  # every 4-8 hours. Sync now runs locally every 15 min via the
  # haodu-notion-sync-local job (custom.notion-blog-sync runner).
  # Manual dispatch kept as a fallback.
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Notion content
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          # Optional: auto-discovers all shared pages if not set
          NOTION_PARENT_PAGE_IDS: ${{ secrets.NOTION_PARENT_PAGE_IDS }}
        run: node scripts/sync-notion.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/ src/notion-categories.json public/notion-assets/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "sync: update blog content from Notion

          Automated sync by GitHub Actions

          Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi
